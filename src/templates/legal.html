<!doctype html>
<!-- GENERATED by scripts/content.mjs from src/templates/legal.html — edit the Markdown in content/legal/, not this file -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="/icon-192x192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-icon-180x180.png" />
    <meta name="theme-color" content="#a9e724" />

    <title>{{title}} — Zaumu</title>
    <meta name="description" content="{{description}}" />
    <!--@seo path="/legal/{{slug}}" type="website" modified="{{isoDate}}"-->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" /></noscript>
    <script type="module" src="/src/main.ts"></script>
    {{jsonld}}
  </head>

  <body class="bg-white text-black" data-page="legal" data-legal="{{slug}}">
    <!--@include header-->

    <main>
      <!-- ============================================================ HEADER -->
      <section class="relative overflow-hidden bg-cream">
        <span class="scribble scribble-ring pointer-events-none absolute -right-24 -top-24 w-[260px] text-violet opacity-25 lg:-right-16 lg:-top-28 lg:w-[380px]" aria-hidden="true"></span>
        <span class="scribble scribble-double pointer-events-none absolute left-6 top-[84px] w-[64px] text-brand lg:left-[102px] lg:top-[80px]" aria-hidden="true"></span>
        <div class="relative mx-auto max-w-[1440px] px-6 py-12 lg:px-[102px] lg:py-[56px]">
          <p class="text-[13px] font-extrabold uppercase tracking-[0.12em] text-brand-deep">Legal</p>
          <h1 class="mt-3 max-w-[860px] text-[30px] font-extrabold leading-[1.15] tracking-[-0.4px] sm:text-[38px] lg:text-[46px]">{{title}}</h1>
          <p class="mt-4 max-w-[680px] text-[16px] font-medium leading-[26px] text-black/75">{{description}}</p>
          <p class="mt-5 text-[13px] font-semibold text-black/55">Last updated <time datetime="{{isoDate}}">{{date}}</time></p>

          <!-- document switcher -->
          <nav aria-label="Legal documents" class="mt-8 flex flex-wrap gap-2 text-[13px] font-semibold">
{{switcher}}
          </nav>
        </div>
      </section>

      <!-- ============================================================ BODY -->
      <section class="bg-white">
        <div class="mx-auto grid max-w-[1440px] gap-12 px-6 py-12 lg:grid-cols-[minmax(0,760px)_minmax(0,1fr)] lg:gap-20 lg:px-[102px] lg:py-[64px]">
          <article class="prose prose-legal">{{body}}</article>

          <aside class="space-y-8 lg:sticky lg:top-32 lg:self-start">
            {{toc}}
            <div class="rounded-2xl border border-black/10 p-6 text-[13px] leading-[20px] text-black/65">
              <p class="text-[15px] font-extrabold text-black">Questions about this document?</p>
              <p class="mt-2">Write to <a href="mailto:support@zaumu.com" class="font-bold text-black underline decoration-brand decoration-2 underline-offset-4">support@zaumu.com</a> and we'll get back to you within two business days.</p>
            </div>
          </aside>
        </div>
      </section>
    </main>

    <!--@include footer-->
  </body>
</html>
